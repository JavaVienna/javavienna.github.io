# ---- Site ----
# site.title / site.description come from content/index.html frontmatter.
site.url=https://www.java.wien

# ---- Content model ----
# Event and speaker DETAIL pages are plain markdown files under content/events/ and
# content/speakers/ (each with `layout: event` / `layout: speaker` in its front matter);
# Roq renders one static page per file at /events/<slug>/ and /speakers/<slug>/.
# List/home pages read derived JSON beans (data/eventsByYear.json, data/home.json,
# data/speakersList.json) — see src/main/java/wien/java/*.java. All of it is produced by
# the exporter in ../exporter and synced in with ../exporter/02_sync.sh.

# Companies are a real Roq file collection (content/companies/*.md): this lets the
# companies LIST page (content/companies.html) iterate them with
# site.collections.companies.sortBy('name') and filter for the Hall of Fame tab — no
# companies.json needed. Detail pages render at /companies/<slug>/ via the `company` layout.
site.collections.companies.layout=company

# Event slugs are date-prefixed (YYYY-MM-DD-<title>); Roq reads that as the document date and
# hides future-dated docs by default. Upcoming events must show (the home page has a "Next
# Upcoming Event"), so publish future-dated documents.
site.future=true

# ---- Dev server: NOT 8080 (raffle app owns it) ----
quarkus.http.port=8099
